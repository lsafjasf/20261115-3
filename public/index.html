<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>节点编辑器 · 生命周期与缓存监控</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: #1d2330;
      --line: #33405a;
      --accent: #5eb1ff;
      --danger: #ff6b6b;
      --ok: #58d68d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #12161f;
      color: #e6ebf5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; }
    .stat label { color: #93a0b8; margin-right: 6px; }
    .stat strong { font-variant-numeric: tabular-nums; }
    .cache strong { color: var(--accent); }
    main { flex: 1; position: relative; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .toolbar {
      position: absolute;
      left: 16px;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: #243049;
      color: #e6ebf5;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      min-width: 150px;
      text-align: left;
    }
    button:hover { border-color: var(--accent); }
    button.danger:hover { border-color: var(--danger); }
    button:disabled { opacity: .5; cursor: default; }
    #log {
      position: absolute;
      right: 16px;
      bottom: 16px;
      max-width: 42%;
      max-height: 38%;
      overflow: auto;
      background: rgba(20, 26, 38, .92);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: 12px/1.6 ui-monospace, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>音频 / 图形节点编辑器</h1>
    <div class="stats">
      <div class="stat"><label>当前节点数</label><strong id="nodeCount">0</strong></div>
      <div class="stat"><label>连接数</label><strong id="edgeCount">0</strong></div>
      <div class="stat"><label>事件监听</label><strong id="listenerCount">0</strong></div>
      <div class="stat cache"><label>估算缓存量</label><strong id="cacheBytes">0 B</strong></div>
      <div class="stat"><label>处理帧</label><strong id="tickCount">0</strong></div>
    </div>
  </header>
  <main>
    <canvas id="stage"></canvas>
    <div class="toolbar">
      <button id="addBtn">+ 添加节点链（5 个）</button>
      <button id="removeBtn" class="danger">− 删除全部节点</button>
      <button id="soakBtn">⟳ 循环增删 50 次（固定脚本）</button>
    </div>
    <div id="log"></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
