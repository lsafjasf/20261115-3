<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曲线标题排版工具</title>
<style>
  :root { --bg:#0f1420; --panel:#1a2233; --line:#2b3852; --fg:#e8edf7; --dim:#8b98b5; --accent:#5aa2ff; --warn:#ff7a7a; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:17px; margin:0; }
  header span { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: 300px 1fr; gap:16px; padding:16px 20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .panel label { display:block; margin:12px 0 4px; color:var(--dim); font-size:12px; }
  .panel label output { float:right; color:var(--fg); }
  .panel input[type=range] { width:100%; accent-color:var(--accent); }
  .panel select, .panel textarea { width:100%; background:#121a2b; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  .panel textarea { resize:vertical; min-height:64px; }
  .stage { position:relative; }
  canvas { width:100%; background:#0b101c; border:1px solid var(--line); border-radius:10px; display:block; }
  .bar { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  button { background:var(--accent); color:#06101f; border:0; border-radius:7px;
           padding:8px 16px; font:600 13px system-ui; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  #status { font-size:12px; color:var(--dim); }
  #status.warn { color:var(--warn); font-weight:600; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; margin-top:12px; }
  .stat { background:#121a2b; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .stat b { display:block; font-size:16px; }
  .stat span { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>曲线标题排版工具</h1>
  <span>沿曲线排布标题 · 急弯防翻面/防塌缩 · 中英文混排自动换行 · SVG 轮廓导出</span>
</header>
<main>
  <div class="panel">
    <label>标题文字（支持中英文混排）</label>
    <textarea id="text">Hello世界，曲线标题2026！</textarea>

    <label>曲线形状</label>
    <select id="preset">
      <option value="arc">弧线</option>
      <option value="wave">波浪</option>
      <option value="hook">急弯（测试）</option>
    </select>

    <label>弯曲强度 <output id="o-strength"></output></label>
    <input type="range" id="strength" min="0" max="100" value="65">

    <label>字号 <output id="o-fontSize"></output></label>
    <input type="range" id="fontSize" min="16" max="120" value="52">

    <label>字距 <output id="o-spacing"></output></label>
    <input type="range" id="spacing" min="-4" max="40" value="4">

    <label>基线偏移 <output id="o-baseline"></output></label>
    <input type="range" id="baseline" min="-60" max="60" value="0">

    <label>粗细（描边） <output id="o-weight"></output></label>
    <input type="range" id="weight" min="0" max="6" step="0.5" value="0">

    <label>最大行数 <output id="o-maxLines"></output></label>
    <input type="range" id="maxLines" min="1" max="4" value="2">

    <div class="bar">
      <button id="export">导出 SVG（可编辑轮廓）</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="stage">
    <canvas id="canvas" width="960" height="420"></canvas>
    <div class="stats">
      <div class="stat"><b id="s-len">–</b><span>曲线长度 px</span></div>
      <div class="stat"><b id="s-lines">–</b><span>行数</span></div>
      <div class="stat"><b id="s-glyphs">–</b><span>字形数</span></div>
      <div class="stat"><b id="s-clamp">–</b><span>急弯修正次数</span></div>
      <div class="stat"><b id="s-boost">–</b><span>间距保护次数</span></div>
      <div class="stat"><b id="s-overflow">–</b><span>越界字符</span></div>
    </div>
  </div>
</main>
<script src="vendor/opentype.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
