<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无缝纹理生成器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 system-ui, sans-serif;
    background: #1e1f24; color: #ddd;
    display: flex; min-height: 100vh;
  }
  #panel {
    width: 300px; padding: 16px; overflow-y: auto;
    background: #26272e; border-right: 1px solid #3a3b44;
    flex-shrink: 0;
  }
  #panel h1 { font-size: 17px; margin: 0 0 12px; }
  #panel h2 {
    font-size: 13px; margin: 18px 0 6px; color: #9ab;
    border-bottom: 1px solid #3a3b44; padding-bottom: 4px;
  }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 0 0 92px; font-size: 12px; color: #aab; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .row .val { flex: 0 0 40px; text-align: right; font-size: 12px; color: #8c9; }
  .row input[type=number] { width: 90px; }
  .row input[type=color] { width: 40px; height: 24px; border: none; background: none; padding: 0; }
  button {
    background: #3d6b35; color: #fff; border: none; border-radius: 4px;
    padding: 7px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #4a8041; }
  button.secondary { background: #3a3b44; }
  button.secondary:hover { background: #4a4b56; }
  button.active { outline: 2px solid #8c9; }
  #main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  canvas { image-rendering: pixelated; background: #111; border: 1px solid #3a3b44; }
  #view { width: 512px; height: 512px; cursor: crosshair; touch-action: none; }
  #tiled { width: 384px; height: 384px; }
  #status { font-size: 12px; color: #9ab; min-height: 18px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .hint { font-size: 11px; color: #778; }
</style>
</head>
<body>
<div id="panel">
  <h1>无缝纹理生成器</h1>
  <div class="row">
    <label>Seed</label>
    <input type="number" id="seed" value="1337">
    <button class="secondary" id="randSeed" title="随机种子">🎲</button>
  </div>

  <h2>石纹层</h2>
  <div class="row"><label>缩放</label><input type="range" id="stoneScale" min="2" max="16" step="1" value="6"><span class="val"></span></div>
  <div class="row"><label>方向°</label><input type="range" id="grainAngle" min="0" max="180" step="1" value="30"><span class="val"></span></div>
  <div class="row"><label>纹理拉伸</label><input type="range" id="grainLength" min="0" max="0.25" step="0.005" value="0.06"><span class="val"></span></div>
  <div class="row"><label>对比度</label><input type="range" id="contrast" min="0.6" max="2" step="0.05" value="1.15"><span class="val"></span></div>
  <div class="row"><label>深色</label><input type="color" id="colorDark" value="#4a4a50">
       <label style="flex:0 0 30px">浅色</label><input type="color" id="colorLight" value="#9a948a"></div>

  <h2>裂纹层</h2>
  <div class="row"><label>细胞密度</label><input type="range" id="cells" min="0" max="20" step="1" value="8"><span class="val"></span></div>
  <div class="row"><label>细胞缝宽</label><input type="range" id="crackWidth" min="0.004" max="0.04" step="0.002" value="0.012"><span class="val"></span></div>
  <div class="row"><label>裂纹数量</label><input type="range" id="walkCount" min="0" max="60" step="1" value="22"><span class="val"></span></div>
  <div class="row"><label>裂纹方向°</label><input type="range" id="walkAngle" min="0" max="180" step="1" value="30"><span class="val"></span></div>
  <div class="row"><label>方向散布°</label><input type="range" id="walkSpread" min="0" max="90" step="1" value="35"><span class="val"></span></div>
  <div class="row"><label>裂纹宽度</label><input type="range" id="walkWidth" min="0.001" max="0.012" step="0.0005" value="0.0035"><span class="val"></span></div>
  <div class="row"><label>裂纹强度</label><input type="range" id="crackIntensity" min="0" max="1" step="0.05" value="0.8"><span class="val"></span></div>

  <h2>苔藓层</h2>
  <div class="row"><label>覆盖度</label><input type="range" id="mossCoverage" min="0" max="1" step="0.02" value="0.35"><span class="val"></span></div>
  <div class="row"><label>缩放</label><input type="range" id="mossScale" min="2" max="14" step="1" value="5"><span class="val"></span></div>
  <div class="row"><label>颜色</label><input type="color" id="mossColor" value="#4e6b2f"></div>

  <h2>刷子（自动同步到对边）</h2>
  <div class="btnrow" id="tools">
    <button data-tool="mossAdd" class="secondary">＋苔藓</button>
    <button data-tool="mossRemove" class="secondary">－苔藓</button>
    <button data-tool="darken" class="secondary">压暗</button>
    <button data-tool="lighten" class="secondary">提亮</button>
  </div>
  <div class="row"><label>笔刷大小</label><input type="range" id="brushSize" min="4" max="80" step="1" value="28"><span class="val"></span></div>
  <div class="row"><label>笔刷强度</label><input type="range" id="brushStrength" min="0.05" max="1" step="0.05" value="0.4"><span class="val"></span></div>
  <div class="btnrow"><button class="secondary" id="clearBrush">清除笔迹</button></div>

  <h2>导出 PNG</h2>
  <div class="btnrow">
    <button id="export512">导出 512</button>
    <button id="export1024">导出 1024</button>
  </div>
  <p class="hint">同一 seed 下两种尺寸由同一连续场采样，1024 缩小后与 512 直接输出一致。命令行验证：<code>node verify.js</code></p>
</div>

<div id="main">
  <canvas id="view" width="512" height="512"></canvas>
  <div id="status">就绪</div>
  <div>
    <div class="hint">2×2 平铺预览（检验四边环绕连续性）：</div>
    <canvas id="tiled" width="512" height="512"></canvas>
  </div>
</div>

<script src="generator.js"></script>
<script src="app.js"></script>
</body>
</html>
