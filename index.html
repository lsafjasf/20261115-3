<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极地营地 · 48小时生存模拟</title>
<style>
  :root {
    --bg: #0b1220; --panel: #131c2e; --line: #26334d;
    --txt: #cfe0f5; --dim: #7d90ad; --accent: #ffb347;
    --ok: #5fd68a; --warn: #ffcf5c; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  h1 { font-size: 20px; margin: 14px 0 4px; letter-spacing: 2px; }
  #sub { color: var(--dim); margin-bottom: 10px; font-size: 12px; }
  #wrap { display: flex; gap: 12px; width: 1180px; max-width: 98vw; }
  #left { flex: 1; }
  canvas { width: 100%; background: #0a0f1c; border: 1px solid var(--line); border-radius: 8px; display: block; }
  #side { width: 320px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: var(--accent); letter-spacing: 1px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; gap: 6px; }
  .val { font-variant-numeric: tabular-nums; }
  button {
    background: #1d2a44; color: var(--txt); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
  }
  button:hover { border-color: var(--accent); }
  button.on { background: #2c4a2e; border-color: var(--ok); color: var(--ok); }
  button.danger { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  #log { height: 150px; overflow-y: auto; font-size: 11px; color: var(--dim); }
  #log .bad { color: var(--bad); } #log .ok { color: var(--ok); } #log .warn { color: var(--warn); }
  .bar { height: 8px; background: #0a0f1c; border-radius: 4px; overflow: hidden; flex: 1; }
  .bar > div { height: 100%; transition: width .3s; }
  #banner {
    display: none; margin-top: 10px; padding: 10px 18px; border-radius: 8px;
    font-size: 16px; font-weight: bold; letter-spacing: 2px;
  }
  #banner.win { display: block; background: #14351f; color: var(--ok); border: 1px solid var(--ok); }
  #banner.lose { display: block; background: #3a1414; color: var(--bad); border: 1px solid var(--bad); }
</style>
</head>
<body>
  <h1>极地营地 · 48 小时生存模拟</h1>
  <div id="sub">分配热量 · 切换负载 · 安排巡查 —— 暴风雪会削弱太阳能并阻断燃料运输</div>
  <div id="wrap">
    <div id="left">
      <canvas id="cv" width="840" height="560"></canvas>
      <div id="banner"></div>
    </div>
    <div id="side">
      <div class="card" id="statusCard"><h2>营地状态</h2></div>
      <div class="card"><h2>取暖舱 / 负载</h2><div class="btns" id="loadBtns"></div></div>
      <div class="card"><h2>备用发电机（顺序：预热→点火→接载）</h2><div class="btns" id="genBtns"></div></div>
      <div class="card"><h2>人员巡查</h2><div class="btns" id="crewBtns"></div></div>
      <div class="card"><h2>模拟控制</h2><div class="btns" id="simBtns"></div></div>
      <div class="card"><h2>事件日志</h2><div id="log"></div></div>
    </div>
  </div>
  <script src="js/sim.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
