<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>确定性回放小游戏</title>
<style>
  body { font-family: system-ui, sans-serif; background: #16181d; color: #e6e6e6;
         display: flex; gap: 24px; justify-content: center; padding: 24px; margin: 0; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 14px; margin: 16px 0 8px; color: #9aa4b2; }
  canvas { background: #0b0d10; border: 1px solid #2a2f38; border-radius: 6px; }
  button { background: #2d6cdf; color: #fff; border: 0; border-radius: 5px;
           padding: 6px 12px; margin: 2px 4px 2px 0; cursor: pointer; font-size: 13px; }
  button:disabled { background: #3a3f4a; cursor: default; }
  button.warn { background: #b3541e; }
  .panel { width: 340px; }
  .stat { font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.7; }
  #status { padding: 8px 10px; border-radius: 6px; background: #1d2127;
            font-size: 13px; min-height: 20px; margin-top: 8px; white-space: pre-line; }
  #status.bad { background: #4a1d1d; }
  #status.good { background: #17351f; }
  #timeline { display: flex; flex-wrap: wrap; gap: 2px; max-height: 180px;
              overflow-y: auto; background: #0b0d10; padding: 8px;
              border-radius: 6px; border: 1px solid #2a2f38; }
  .cell { width: 16px; height: 16px; border-radius: 3px; background: #2f8f4e;
          font-size: 9px; color: #dff; text-align: center; line-height: 16px;
          cursor: pointer; user-select: none; }
  .cell.mismatch { background: #c0392b; }
  .cell.pending { background: #3a3f4a; }
  .cell.cursor { outline: 2px solid #ffd166; }
  .hint { font-size: 12px; color: #7d8590; }
</style>
</head>
<body>
  <div>
    <h1>躲避方块 · 确定性录制/回放</h1>
    <canvas id="view" width="280" height="560"></canvas>
    <div id="status">加载中…</div>
  </div>
  <div class="panel">
    <h2>对局控制（← → 移动）</h2>
    <div>
      <button id="btnPause">暂停</button>
      <button id="btnStep">单步</button>
      <button id="btnNew">新对局</button>
      <button id="btnFinish" class="warn">结束并回放</button>
    </div>
    <div class="stat" id="liveStats"></div>

    <h2>回放 / 校验</h2>
    <div>
      <button id="btnRpPlay" disabled>回放播放</button>
      <button id="btnRpStep" disabled>回放单步</button>
      <button id="btnValidate" disabled>校验整局</button>
      <button id="btnTamper" class="warn" disabled>篡改一条输入</button>
    </div>
    <div class="stat" id="replayStats"></div>

    <h2>差异时间轴（每格 = 1 tick，红 = 分叉）</h2>
    <div id="timeline"></div>
    <p class="hint">绿=哈希一致，红=首个分叉起的差异，灰=未回放。点击格子跳转到该 tick。</p>
  </div>
  <script type="module" src="src/ui.js"></script>
</body>
</html>
