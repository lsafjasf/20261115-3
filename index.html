<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拼贴画编辑器</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>拼贴画编辑器</h1>
    <div class="toolbar">
      <button id="btn-undo" title="撤销 (Ctrl+Z)">↩ 撤销</button>
      <button id="btn-redo" title="重做 (Ctrl+Y)">↪ 重做</button>
      <span class="sep"></span>
      <button id="btn-save">💾 保存工程</button>
      <button id="btn-load">📂 载入工程</button>
      <button id="btn-download-project">⬇ 导出工程 JSON</button>
      <input type="file" id="file-project" accept="application/json" hidden />
      <span class="sep"></span>
      <label class="chk"><input type="checkbox" id="chk-safezone" checked /> 显示标题安全区</label>
      <button id="btn-export" class="primary">🖼 导出 PNG</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage-wrap">
      <div id="stage" class="stage">
        <div id="safezone" class="safezone">
          <span class="safezone-label">主标题安全区 · 请勿遮挡</span>
        </div>
      </div>
      <p id="safezone-warning" class="warning" hidden>⚠ 有图层遮挡了主标题安全区，请调整位置或层级。</p>
    </section>

    <aside class="panel">
      <h2>图层</h2>
      <ul id="layer-list" class="layer-list"></ul>

      <div id="layer-controls" class="layer-controls" hidden>
        <h2>选中图层</h2>
        <div class="row">
          <label>透明度 <span id="opacity-val">100%</span></label>
          <input type="range" id="inp-opacity" min="5" max="100" value="100" />
        </div>
        <div class="row">
          <label>旋转 <span id="rotation-val">0°</span></label>
          <input type="range" id="inp-rotation" min="-180" max="180" value="0" />
        </div>
        <div class="row">
          <label>缩放 <span id="scale-val">100%</span></label>
          <input type="range" id="inp-scale" min="20" max="200" value="100" />
        </div>
        <div class="row btns">
          <button id="btn-front">置于顶层</button>
          <button id="btn-up">上移一层</button>
          <button id="btn-down">下移一层</button>
          <button id="btn-back">置于底层</button>
        </div>
        <div class="row btns">
          <button id="btn-crop" class="toggle">✂ 裁切模式</button>
          <button id="btn-crop-reset">重置裁切</button>
        </div>
        <p class="hint">拖动图层移动；拖动绿色手柄旋转；裁切模式下拖动四角手柄调整裁切框。</p>
      </div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
