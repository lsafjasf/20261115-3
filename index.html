<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火山监测站 · 多源融合预警模拟</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🌋 火山监测站 · 多源融合预警</h1>
  <div id="clock">T+00:00:00</div>
  <div id="verdict">配置滤波 / 权重 / 持续判据后启动模拟</div>
</header>

<main>
  <aside id="panel">
    <h2>融合参数</h2>
    <div id="sensorControls"></div>
    <h2>判据</h2>
    <label>报警阈值 <span id="alertThrVal"></span>
      <input type="range" id="alertThr" min="0.2" max="0.9" step="0.01">
    </label>
    <label>持续判据(秒) <span id="persistVal"></span>
      <input type="range" id="persist" min="5" max="300" step="5">
    </label>
    <label>模拟速度 <span id="speedVal"></span>
      <input type="range" id="speed" min="1" max="6" step="1" value="3">
    </label>
    <div class="btns">
      <button id="btnStart">▶ 启动</button>
      <button id="btnReset">↺ 重置</button>
      <button id="btnExport">⬇ 导出贡献记录</button>
    </div>
    <p class="hint">目标：6 小时模拟内，喷发前至少 1 次有效预警，误报 ≤ 1。<br>
    设备噪声只出现在单个传感器；真实前兆会被多类传感器同时捕获。</p>
    <h2>事件日志</h2>
    <ul id="log"></ul>
  </aside>

  <section id="views">
    <canvas id="waveCanvas" width="980" height="460"></canvas>
    <canvas id="volcanoCanvas" width="980" height="380"></canvas>
    <h2>传感器贡献</h2>
    <table id="contribTable">
      <thead><tr>
        <th>传感器</th><th>权重</th><th>阈值</th><th>滤波</th>
        <th>激活(秒)</th><th>噪声触发(秒)</th><th>峰值</th><th>贡献占比</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="sim.js"></script>
<script src="main.js"></script>
</body>
</html>
