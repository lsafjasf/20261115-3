<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>等距城市生成器</title>
<style>
  :root { --bg: #14181f; --panel: #1e2530; --fg: #dfe6ef; --accent: #4da3ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #stage { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #panel { width: 260px; background: var(--panel); padding: 16px; overflow-y: auto; }
  #panel h1 { font-size: 16px; margin: 0 0 12px; }
  #panel fieldset { border: 1px solid #334; border-radius: 8px; margin: 0 0 12px; padding: 10px; }
  #panel legend { padding: 0 6px; color: #9ab; }
  label { display: block; margin: 6px 0 2px; color: #9ab; font-size: 12px; }
  input, select, button { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #445; background: #12161d; color: var(--fg); }
  button { cursor: pointer; margin-top: 8px; background: #26303e; }
  button.primary { background: var(--accent); color: #06121f; font-weight: 600; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #selInfo { font-size: 12px; color: #8fa; min-height: 18px; }
  #hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #789; pointer-events: none; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="hint">拖动旋转视角 · 点击建筑选中 · 修改仅影响选中建筑</div>
  </div>
  <div id="panel">
    <h1>等距城市生成器</h1>
    <fieldset>
      <legend>城市参数</legend>
      <label>种子 seed</label>
      <input id="seed" type="number" value="20261115">
      <label>规模 size</label>
      <input id="size" type="number" value="8" min="3" max="16">
      <button id="regen" class="primary">按种子重新生成</button>
    </fieldset>
    <fieldset>
      <legend>选中建筑</legend>
      <div id="selInfo">未选中</div>
      <label>高度（层）</label>
      <input id="height" type="range" min="1" max="9" value="3" disabled>
      <label>屋顶样式</label>
      <select id="roof" disabled>
        <option value="flat">平顶</option>
        <option value="gable">双坡</option>
        <option value="pyramid">尖顶</option>
      </select>
    </fieldset>
    <fieldset>
      <legend>导入 / 导出</legend>
      <button id="exportPng">导出 PNG</button>
      <button id="exportJson">导出城市参数 JSON</button>
      <label>导入 JSON</label>
      <input id="importJson" type="file" accept=".json">
    </fieldset>
  </div>
  <script src="city.js"></script>
  <script src="app.js"></script>
</body>
</html>
