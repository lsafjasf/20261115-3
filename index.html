<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多层贴图合成器</title>
  <style>
    :root {
      --bg: #1c1f26;
      --panel: #262a33;
      --panel-2: #2e333e;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #5b9dff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      border-right: 1px solid #14161b;
    }
    #toolbar {
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-bottom: 1px solid #14161b;
    }
    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid #3a404d;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #0d1522; font-weight: 600; }
    #layer-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .layer-item {
      background: var(--panel-2);
      border: 1px solid #3a404d;
      border-radius: 8px;
      padding: 8px;
      cursor: grab;
      user-select: none;
    }
    .layer-item.dragging { opacity: 0.4; }
    .layer-item.drop-target { border-color: var(--accent); }
    .layer-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .layer-head .grip { color: var(--muted); cursor: grab; }
    .layer-head .name { flex: 1; font-size: 13px; font-weight: 600; }
    .layer-head .del { padding: 2px 6px; font-size: 12px; }
    .layer-controls { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .layer-controls select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid #3a404d;
      border-radius: 4px;
      padding: 3px;
      font-size: 12px;
    }
    .layer-controls input[type="range"] { flex: 1; }
    .layer-controls .pct { width: 38px; text-align: right; color: var(--muted); }
    #add-row {
      padding: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      border-top: 1px solid #14161b;
    }
    #stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        repeating-conic-gradient(#20242c 0% 25%, #262b34 0% 50%) 0 0 / 24px 24px;
      overflow: auto;
    }
    #preview {
      image-rendering: pixelated;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
      max-width: 90%;
      max-height: 90%;
    }
    #status {
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid #14161b;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="toolbar">
      <button id="btn-undo" title="Ctrl+Z">撤销</button>
      <button id="btn-redo" title="Ctrl+Shift+Z">重做</button>
      <button id="btn-save">保存工程</button>
      <button id="btn-load">载入工程</button>
      <button id="btn-export" class="primary">导出 PNG</button>
      <input type="file" id="file-input" accept=".json" hidden />
    </div>
    <div id="layer-list"></div>
    <div id="add-row">
      <button data-type="background">+ 背景</button>
      <button data-type="frost">+ 磨砂</button>
      <button data-type="stain">+ 污渍</button>
      <button data-type="highlight">+ 高光</button>
    </div>
    <div id="status">就绪</div>
  </div>
  <div id="stage">
    <canvas id="preview" width="512" height="512"></canvas>
  </div>
  <script src="src/compositor.js"></script>
  <script src="src/png.js"></script>
  <script src="src/layers.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
