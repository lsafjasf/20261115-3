<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>矿井通风恢复模拟 — 爆破后排险</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>矿井通风恢复模拟</h1>
    <div class="hud">
      <div class="hud-item">班次时间 <strong id="clock">08:00</strong></div>
      <div class="hud-item">主风机 <strong id="mainState">运行</strong></div>
      <div class="hud-item">局扇 <strong id="localState">停机</strong></div>
      <div class="hud-item">工作面风量 <strong id="faceFlow">0</strong></div>
      <div class="hud-item">进风井风量 <strong id="intakeFlow">0</strong></div>
    </div>
  </header>

  <main>
    <section class="stage">
      <div id="banner" class="banner show">初始化爆破后污染状态…</div>
      <canvas id="mine" width="900" height="600"></canvas>
      <div class="progress">
        <span>本班任务进度</span>
        <div class="bar"><div id="progressBar"></div></div>
        <strong id="progressText">0%</strong>
      </div>
    </section>

    <aside class="panel">
      <h2>风门控制</h2>
      <div class="btn-grid">
        <button id="D1" class="ctrl">D1 关</button>
        <button id="D2" class="ctrl">D2 关</button>
        <button id="D3" class="ctrl">D3 开</button>
        <button id="D4" class="ctrl">D4 开</button>
      </div>
      <p class="hint">D2 为进回风短路风门；D4 为工作面回风风门，误关会把污风压回作业面。</p>

      <h2>主风机（回风井）</h2>
      <div class="btn-grid">
        <button id="mainOn" class="ctrl">开启</button>
        <button id="mainOff" class="ctrl danger">停机</button>
        <button id="reverseBtn" class="ctrl warn">反风切换</button>
      </div>

      <h2>局部排风（风筒）</h2>
      <div class="btn-grid">
        <button id="local_force" class="ctrl good">压入式</button>
        <button id="local_exhaust" class="ctrl warn">抽出式</button>
        <button id="local_off" class="ctrl">停机</button>
      </div>

      <h2>演练与播放</h2>
      <div class="btn-grid">
        <button id="demoRecovery" class="ctrl good">爆破恢复演练</button>
        <button id="demoShort" class="ctrl danger">短路报警验证</button>
        <button id="pauseBtn" class="ctrl">暂停</button>
        <button id="speedBtn" class="ctrl">速度 x1</button>
        <button id="resetBtn" class="ctrl">重置</button>
        <button id="muteBtn" class="ctrl">静音</button>
      </div>

      <h2>工作面关键指标</h2>
      <table class="kv">
        <tr><td>瓦斯 CH₄</td><td id="faceGas">—</td><td id="gasState" class="bad">超标</td></tr>
        <tr><td>粉尘</td><td id="faceDust">—</td><td id="dustState" class="bad">超标</td></tr>
        <tr><td>风流状态</td><td colspan="2" id="shortState" class="good">正常</td></tr>
      </table>

      <h2>传感器读数</h2>
      <table class="sensors">
        <thead><tr><th>节点</th><th>瓦斯%</th><th>粉尘</th></tr></thead>
        <tbody id="sensors"></tbody>
      </table>

      <h2>操作日志</h2>
      <ul id="log" class="log"></ul>
    </aside>
  </main>

  <footer>
    安全阈值：瓦斯 ≤ 0.80% CH₄，粉尘 ≤ 3.0 mg/m³；工班 240 分钟。
    风噪随风压变化，报警时出现间歇蜂鸣。
  </footer>

  <script src="js/sim.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
