<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大画布脏矩形渲染优化对比</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>大画布脏矩形渲染优化</h1>
  <div class="controls">
    <div class="seg" id="modeSeg">
      <button data-mode="full">全量重绘</button>
      <button data-mode="dirty" class="active">脏矩形优化</button>
    </div>
    <label class="slider">
      对象数量 <input type="range" id="objCount" min="100" max="5000" step="100" value="1500">
      <span id="objCountVal">1500</span>
    </label>
    <button id="benchBtn">运行固定场景基准测试</button>
    <span id="verifyBadge" class="badge hidden"></span>
  </div>
</header>

<main>
  <div class="canvas-wrap">
    <canvas id="view" width="960" height="600"></canvas>
    <div class="hint">拖动画面平移视口 · 世界尺寸 3200×2400</div>
  </div>
  <aside>
    <h2>实时指标</h2>
    <dl class="stats">
      <dt>FPS</dt><dd id="statFps">—</dd>
      <dt>帧时间（渲染）</dt><dd id="statMs">—</dd>
      <dt>重绘面积</dt><dd id="statArea">—</dd>
      <dt>脏矩形数</dt><dd id="statRects">—</dd>
    </dl>
    <h2>基准测试结果（固定场景）</h2>
    <table id="benchTable">
      <thead>
        <tr><th>模式</th><th>平均帧时间</th><th>平均重绘面积</th><th>重绘占比</th></tr>
      </thead>
      <tbody>
        <tr><td>全量重绘</td><td id="fullMs">—</td><td id="fullArea">—</td><td>100%</td></tr>
        <tr><td>脏矩形优化</td><td id="dirtyMs">—</td><td id="dirtyArea">—</td><td id="dirtyPct">—</td></tr>
        <tr class="summary"><td>提升</td><td id="speedup" colspan="3">—</td></tr>
      </tbody>
    </table>
    <p class="note">基准场景：2000 个对象（约 30% 活动）· 240 帧 · 固定随机种子 · 脚本化视口突发平移 · 每 30 帧更新一次动态文字。两种模式逐帧哈希 + 末帧逐像素比对，结果必须完全一致。</p>
  </aside>
</main>

<script src="engine.js"></script>
<script src="main.js"></script>
</body>
</html>
