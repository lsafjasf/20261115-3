<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>弯曲步道空间音频编辑器</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>弯曲步道 · 五声源空间音频</h1>
      <p class="hint">
        在画布上拖动控制点绘制闭合弯曲路线，拖动五个声源定位；为每段设置环境声、衰减和混响。
      </p>
    </header>

    <main>
      <section class="stage">
        <canvas id="map" width="820" height="660"></canvas>
        <div class="tools">
          <button id="modeRoute" class="active">编辑路线</button>
          <button id="modeSource">拖动声源</button>
          <button id="resetView">重置场景</button>
        </div>
        <div class="telemetry" id="telemetry">
          <div>进度 <b id="tU">0.000</b></div>
          <div>段 <b id="tSeg">0</b></div>
          <div>混响 <b id="tReverb">0</b></div>
        </div>
      </section>

      <aside class="panel">
        <h2>分段设置</h2>
        <div id="segmentList" class="segment-list"></div>

        <h2>声源</h2>
        <ul id="sourceList" class="source-list"></ul>

        <h2>传输</h2>
        <div class="transport">
          <button id="play">▶ 播放</button>
          <button id="pause">⏸ 暂停</button>
          <button id="stop">⏹ 回到起点</button>
        </div>

        <h2>导出</h2>
        <div class="export">
          <button id="exportRoute">导出路线 JSON</button>
          <button id="importRoute">导入路线</button>
          <input type="file" id="routeFile" accept="application/json" hidden />
          <button id="exportWav">导出双耳混音 WAV（完整一圈）</button>
          <p id="exportStatus" class="export-status"></p>
        </div>
      </aside>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
